[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bobo-agent"
version = "0.5.0"
description = "Bobo — a personal AI agent for your terminal, Obsidian, and email"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "niuqingwei"},
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Newton-666/boboagent"

[project.scripts]
bobo = "bobo_tui_gateway.entry:main"

[tool.setuptools.packages.find]
include = ["bobo_tui_gateway*", "core*", "tools*"]

[tool.setuptools.package-data]
bobo_tui_gateway = ["static/entry.js", "static/package.json"]

[tool.setuptools]
py-modules = ["config"]  # install config.py as a top-level module

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = ["-v", "--tb=short", "--strict-markers", "-m", "not live", "--ignore=experiments"]  # 分层（TICKET-MAIN-REGREEN 阶段 2）：本地默认跳过 live，CI 显式覆盖为全量；--ignore=experiments 防止 cost1a 沙盒同名 test_*.py 模块冲突污染收集
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests for individual functions",
    "integration: integration tests that cross module boundaries",
    "security: security-related tests",
    "live: socket/时序敏感测试（真开 socket，环境抖动会误报）——本地跳过、CI 全量跑（分层阶段 2）",
]
