name: Test

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --no-dev
          uv pip install pytest pytest-cov
      - name: Run tests
        # GitHub #4：Linux CI 全量收集会被 pandas/ApplicationServices ImportError 中断；
        # conftest collect_ignore + 本步指定文件。#2 超时/写槽测必须一起跑。
        # GitHub #11：loop_detect 误杀/变参绕圈测必须一起跑。
        # GitHub #10：headers_stall 可重试分类测必须一起跑。
        # GitHub #9：Anthropic Messages adapter 测必须一起跑。
        run: uv run pytest -v --tb=short tests/test_issue4_write_approval_high_risk.py tests/test_command_safety.py tests/test_auto_mode.py tests/test_auto_mode_b.py tests/test_ticket_safety_1.py tests/test_engine_adapter_interrupt.py tests/test_tool_timeout_lifecycle.py tests/test_execute_terminal_interrupt.py tests/test_engine_injection_pollution.py tests/test_loop_detect.py tests/test_ticket_core_r1.py tests/test_llm_caller.py tests/test_anthropic_adapter.py
        env:
          DEEPSEEK_API_KEY: "sk-test-placeholder"
          OBSIDIAN_VAULT: "/tmp"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Smoke test — first-run setup + tool registration
        run: |
          export BOBO_DATA_DIR=$(mktemp -d)
          mkdir -p "$BOBO_DATA_DIR"
          export DEEPSEEK_API_KEY="sk-test-placeholder"

          # 验证工具注册数（防循环 import / 语法错误类静默丢工具）
          TOOL_COUNT=$(python3 -c "
          import os, sys
          os.environ['BOBO_DATA_DIR'] = '$BOBO_DATA_DIR'
          os.environ['DEEPSEEK_API_KEY'] = 'sk-test'
          sys.path.insert(0, '.')
          from tools import TOOLS_SCHEMA
          print(len(TOOLS_SCHEMA))
          " 2>/dev/null)
          echo "Tool count: $TOOL_COUNT"
          # GitHub #4：TOOLS_SCHEMA 是 park 过滤后的上线集（Linux 约 25，远低于历史 79）。
          # 烟测只拦发现链路崩盘（循环 import / 语法错误把工具静默丢光），不拦外挂仓。
          if [ -z "$TOOL_COUNT" ] || [ "$TOOL_COUNT" -lt 20 ]; then
            echo "FAIL: tool count $TOOL_COUNT < 20 (possible import error)"
            exit 1
          fi
          echo "PASS: tool count $TOOL_COUNT >= 20"

          # 验证 setup.submit 不会因为 BOBO_DATA_DIR 未定义而崩溃
          # GitHub #4：handler 已迁到 handlers/configs.py，server 不再 re-export。
          python3 -c "
          import os, sys, json
          os.environ['BOBO_DATA_DIR'] = '$BOBO_DATA_DIR'
          os.environ['DEEPSEEK_API_KEY'] = 'sk-test-setup'
          os.environ.setdefault('OBSIDIAN_VAULT', '/tmp')
          sys.path.insert(0, '.')
          from bobo_tui_gateway.handlers.configs import handle_setup_submit
          result = handle_setup_submit(
              {'provider': 'deepseek', 'api_key': 'sk-test-12345'}, 'test_rid'
          )
          data = result.get('result', {})
          ok = data.get('ok', False)
          print(f'setup.submit ok={ok}')
          assert ok, f'setup.submit failed: {data}'
          print('PASS: setup.submit works')

          # 验证 .env 确实被写入
          env_path = os.path.join('$BOBO_DATA_DIR', '.env')
          assert os.path.exists(env_path), f'.env not created at {env_path}'
          with open(env_path) as f:
              content = f.read()
          assert 'DEEPSEEK_API_KEY=sk-test-12345' in content, f'.env missing key'
          print('PASS: .env written correctly')
          "
          echo "=== SMOKE TEST PASSED ==="
